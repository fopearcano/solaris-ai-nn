[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solaris-ai-nn"
version = "0.1.0"
description = "Low-compute, continuous-learning neural substrate laboratory for Solaris_Ai."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "fopearcano" }]
keywords = [
    "reservoir-computing",
    "echo-state-network",
    "continual-learning",
    "online-learning",
    "low-compute",
    "solaris",
]
# Core layers (signals, ESN, readout, runtime) remain pure stdlib. NumPy joined
# in Phase 6 for the substrate laboratory (liquid-state / spiking substrates,
# .npz state persistence) -- the place dense vector math was always slated to
# earn it (see README / docs/RESEARCH_NOTES.md).
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
solaris-nn-demo = "solaris_ai_nn.experiments.minimal_continuous_esn:main"
solaris-nn = "solaris_ai_nn.conscience.cli:main"
solaris-nn-scenario = "solaris_ai_nn.conscience.cli:scenario_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
